name: Deploy API Server

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t api-server .
          docker tag api-server:latest ${{ secrets.ECR_URI }}:latest

      - name: Push Docker image to ECR
        run: docker push ${{ secrets.ECR_URI }}:latest

      - name: Deploy to EC2 via SSM
        id: deploy
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker stop api-server || true",
              "docker rm api-server || true",
              "docker pull '${{ secrets.ECR_URI }}':latest",
              "docker run -d --name api-server -p 3000:3000 -e NODE_ENV=production -e DB_TYPE='${{ secrets.DB_TYPE }}' -e DB_HOST='${{ secrets.DB_HOST }}' -e DB_PORT='${{ secrets.DB_PORT }}' -e DB_USERNAME='${{ secrets.DB_USERNAME }}' -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' -e DB_DATABASE='${{ secrets.DB_DATABASE }}' -e DB_SSL_CERT_PATH='${{ secrets.DB_SSL_CERT_PATH }}' -e JWT_SECRET_ACCESS='${{ secrets.JWT_SECRET_ACCESS }}' -e JWT_SECRET_REFRESH='${{ secrets.JWT_SECRET_REFRESH }}' -e AWS_REGION='${{ secrets.AWS_REGION }}' -e AWS_S3_BUCKET_NAME='${{ secrets.AWS_S3_BUCKET_NAME }}' -e INTERNAL_API_KEY='${{ secrets.INTERNAL_API_KEY }}' -e API_BASE_URL='${{ secrets.API_BASE_URL }}' '${{ secrets.ECR_URI }}':latest"
            ]' \
            --comment "Deploy API Server" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          STATUS="Pending"
          for i in {1..30}; do
            STATUS=$(aws ssm list-command-invocations \
              --command-id $COMMAND_ID \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)
            echo "Current status: $STATUS"
            if [ "$STATUS" != "Pending" ] && [ "$STATUS" != "InProgress" ]; then
              break
            fi
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed with status: $STATUS"
            exit 1
          fi
